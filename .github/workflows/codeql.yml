# CodeQL: GitHub's free security scan for public repos. Findings show under Security > Code scanning.
name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # Mondays

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning is free only on public repos. While the repo is private this is skipped
    # instead of failing; it starts working by itself once the repo is made public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
