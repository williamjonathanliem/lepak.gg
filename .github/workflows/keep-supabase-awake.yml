# Supabase's free plan pauses a project after about a week with no activity.
# This pings the database every 3 days so Lepak Pages stays up.
#
# Needs two repository secrets (GitHub repo > Settings > Secrets and variables > Actions):
#   SUPABASE_URL       e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  the public anon / publishable key (NOT the secret service key)
#
# Note: GitHub turns off scheduled jobs in repos with no commits for 60 days.
# If that happens, re-enable it from the Actions tab.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 */3 * *' # 03:17 UTC (11:17 MYT) every 3 days
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY secret." >&2
            exit 1
          fi
          # A real database read (looks up a page that doesn't exist), so it counts as activity.
          status=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/get_page" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"p_slug":"keepalive-ping"}')
          echo "Supabase answered $status"
          test "$status" = "200"
